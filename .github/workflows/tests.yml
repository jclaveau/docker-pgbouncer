name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Every variable the entrypoint reads has a case
        run: tests/coverage.sh

      - name: Build the image
        run: make docker-x86 IMAGE_VERSION=test

      - name: Rendered config matches the expectations
        run: tests/run.sh
        env:
          IMAGE: edoburu/pgbouncer:test

      - name: Pooler serves traffic with the config it loaded
        run: tests/live.sh
        env:
          IMAGE: edoburu/pgbouncer:test
