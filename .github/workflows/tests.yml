name: tests

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Every variable the entrypoint reads has a case
        run: tests/coverage.sh

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        run: make docker-x86 IMAGE_VERSION=test

      - name: Hand the image to the test jobs
        run: docker save edoburu/pgbouncer:test -o image.tar

      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  rendered-config:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - run: docker load -i image.tar

      - name: Rendered config matches the expectations
        run: tests/run.sh
        env:
          IMAGE: edoburu/pgbouncer:test

  live:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['18-alpine', '17-alpine']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - run: docker load -i image.tar

      - name: Pooler serves traffic with the config it loaded
        run: tests/live.sh
        env:
          IMAGE: edoburu/pgbouncer:test
          POSTGRES_IMAGE: postgres:${{ matrix.postgres }}

  # The image the tests just ran, never a rebuild of the same commit.
  publish:
    needs: [rendered-config, live]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - run: docker load -i image.tar

      - name: Push to ghcr.io
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ghcr.io/${{ github.repository }}
        run: |
          set -o pipefail
          pgbouncer_version=$(awk -F= '/^ARG VERSION=/ { print $2 }' Dockerfile)

          # An unread version would tag the image "-${GITHUB_SHA::7}" and push it.
          : "${pgbouncer_version:?no ARG VERSION in Dockerfile to tag with}"

          echo "$REGISTRY_TOKEN" \
            | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

          for tag in latest "sha-${GITHUB_SHA::7}" "$pgbouncer_version-${GITHUB_SHA::7}"; do
            docker tag edoburu/pgbouncer:test "$PUBLISHED:$tag"
            docker push "$PUBLISHED:$tag"
          done

          # Read back from the registry, since a tag moves and a consumer pins.
          digest=$(docker buildx imagetools inspect "$PUBLISHED:latest" \
            --format '{{.Manifest.Digest}}')

          {
            echo "### Published"
            echo "\`$PUBLISHED:$pgbouncer_version-${GITHUB_SHA::7}\`"
            echo "\`$PUBLISHED@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
